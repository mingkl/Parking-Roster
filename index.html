-content:space-between;margin-bottom:8px}.person{font-size:1.15rem;font-weight:750}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef2f5;color:#4c6173;font-size:.78rem;margin:2px}.pill.good{background:var(--good)}.pill.warn{background:var(--warn)}.pill.bad{background:var(--bad)}.daygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}.day .date{font-size:.78rem;color:var(--muted)}.day strong{display:block;overflow-wrap:anywhere}.day .slot{margin-top:9px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:.83rem;background:#f8fafc}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{border-radius:12px;padding:12px 14px;background:var(--brand2);margin-bottom:14px}.notice.warn{background:var(--warn)}.notice.bad{background:var(--bad)}.hidden{display:none!important}.weeknav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.weeknav h2{margin:0}.section-title{margin:8px 0 12px}.small{font-size:.82rem}.listitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}.empty{color:var(--muted);padding:18px;text-align:center}.footer{color:var(--muted);font-size:.82rem;text-align:center;padding:18px 0 28px}.badge{font-size:.8rem;padding:4px 8px;border-radius:7px;background:#eef2f5}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hr{height:1px;background:var(--line);margin:14px 0}.help{font-size:.84rem;color:var(--muted);margin-top:4px}.inlinecheck{display:flex;gap:8px;align-items:center}.inlinecheck input{width:auto}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85rem;overflow-wrap:anywhere}

<body>
<header class="top"><div class="topinner"><div class="brandlockup"><img src="./logo.png" alt="Company logo" class="company-logo"><div><h1>Parking Roster</h1><p>Weekly parking allocation · Monday–Friday</p></div></div><span class="status" id="dataStatus">Loading roster data…</span></div></header>
<main class="wrap">
  <div id="globalNotice"></div>
  <nav class="tabs" aria-label="Main navigation">
    <button class="active" data-tab="week">Weekly Schedule</button>
    <button data-tab="employees">People & Annual Leave</button>
    <button data-tab="closure">Office closed</button>
    <button data-tab="admin">Data Management</button>
  </nav>
  <section id="view-week"></section>
    <section id="view-employees" class="hidden"></section>
    <section id="view-closure" class="hidden"></section>
  <section id="view-admin" class="hidden"></section>
  <div class="footer">Roster data is loaded from the published GitHub data.json file. Changes must be exported and published to GitHub before other staff can see them.</div>
</main>
<script>
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const WORKDAY = [1,2,3,4,5];
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
let data = null, sourceError = "", selectedWeek = null, dirty = false;
const today = new Date();
const todayISO = localISO(today);
function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function parseDate(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12,0,0);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localISO(d);}
function mondayOf(s){const d=parseDate(s);const dow=d.getDay();d.setDate(d.getDate()-(dow===0?6:dow-1));return localISO(d);}
function fmt(s,opts={day:"numeric",month:"short"}){const d=parseDate(s);return d?new Intl.DateTimeFormat("en-AU",opts).format(d):s;}
function weekRange(s){return `${fmt(s)} – ${fmt(addDays(s,4))}`;}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(prefix="id"){return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);}
function ensureShape(d){
  d.schemaVersion ||= 1;
  d.settings ||= {}; d.settings.workingDays ||= ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  d.settings.parkingBays ||= ["A","B"]; d.settings.planningWeeks ||= 8; d.settings.rotationOffset ||= 0;
  d.employees ||= []; d.leavePeriods ||= []; d.availabilityPeriods ||= []; d.officeClosures ||= [];
  d.manualOverrides ||= []; d.weeklyAssignments ||= []; d.changeLog ||= [];
  return d;
}
async function loadData(){
  try{
    const r=await fetch("./data.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    data=ensureShape(await r.json());
    $("#dataStatus").textContent="Shared data loaded";
    renderAll();
  }catch(e){
    sourceError=String(e);
    data=ensureShape({settings:{planningWeeks:8,parkingBays:["A","B"],workingDays:["Monday","Tuesday","Wednesday","Thursday","Friday"],rotationOffset:0},employees:[],leavePeriods:[],availabilityPeriods:[],officeClosures:[],manualOverrides:[],weeklyAssignments:[],changeLog:[]});
    $("#dataStatus").textContent="Data file not loaded";
    $("#globalNotice").innerHTML=`<div class="notice warn"><strong>Could not load data.json.</strong><br>Opening index.html directly from your computer may block local JSON access. Publish the project with GitHub Pages, or import data.json under Data Management.</div>`;
    renderAll();
  }
}
function activeEmployees(){return data.employees.filter(e=>e.active!==false).sort((a,b)=>(a.rotationOrder||999)-(b.rotationOrder||999));}
function inRange(date,start,end){return !!start && date>=start && date<= (end||start);}
function isOfficeClosed(date){return data.officeClosures.some(p=>inRange(date,p.startDate,p.endDate));}
function closureFor(date){return data.officeClosures.find(p=>inRange(date,p.startDate,p.endDate));}
function weekHasAnyOpenWorkday(weekStart){return [0,1,2,3,4].some(i=>!isOfficeClosed(addDays(weekStart,i)));}
function isEmployeeOnLeave(e,date){return data.leavePeriods.some(p=>p.employeeId===e.id&&inRange(date,p.startDate,p.endDate));}
function leaveWorkdaysInWeek(e,weekStart){return [0,1,2,3,4].filter(i=>!isOfficeClosed(addDays(weekStart,i))&&isEmployeeOnLeave(e,addDays(weekStart,i))).length;}
function isLongLeaveForWeek(e,weekStart){return leaveWorkdaysInWeek(e,weekStart)>=5;}
function unavailableForWeek(e,weekStart){
  if(e.active===false||isLongLeaveForWeek(e,weekStart))return true;
  // Retain compatibility with legacy availability data, although the current UI no longer creates these records.
  return data.availabilityPeriods.some(p=>p.employeeId===e.id&&[0,1,2,3,4].every(i=>isOfficeClosed(addDays(weekStart,i))||inRange(addDays(weekStart,i),p.startDate,p.endDate)));
}
function rotationScheduleThrough(targetWeek){
  const people=activeEmployees();
  if(!people.length)return new Map();
  const anchor=mondayOf(data.settings.firstWeekStart||"2026-10-19");
  const target=mondayOf(targetWeek);
  // For dates before the configured anchor, calculate from that date using the same deterministic rules.
  const start=target<anchor?target:anchor;
  let cursor=((Number(data.settings.rotationOffset||0)%people.length)+people.length)%people.length;
  let lastAssigned=[];
  const result=new Map();
  for(let ws=start;ws<=target;ws=addDays(ws,7)){
    if(!weekHasAnyOpenWorkday(ws)){
      result.set(ws,[]);
      continue; // Full office closure pauses both the queue and the last-used state.
    }
    const eligible=people.filter(e=>!unavailableForWeek(e,ws));
    if(!eligible.length){result.set(ws,[]);lastAssigned=[];continue;}
    const selected=[];
    function findNext(avoidLast){
      for(let step=0;step<people.length;step++){
        const idx=(cursor+step)%people.length;
        const candidate=people[idx];
        if(!eligible.some(e=>e.id===candidate.id))continue;
        if(selected.some(e=>e.id===candidate.id))continue;
        if(avoidLast&&lastAssigned.includes(candidate.id))continue;
        cursor=(idx+1)%people.length;
        return candidate;
      }
      return null;
    }
    // First prefer eligible people who were not allocated in the previous open week.
    while(selected.length<2){const e=findNext(true);if(!e)break;selected.push(e);}
    // If there are not two distinct alternatives, repeat an eligible person from last week if needed.
    while(selected.length<2){const e=findNext(false);if(!e)break;selected.push(e);}
    // With exactly one available employee, that person uses both permits.
    if(selected.length===1)selected.push(selected[0]);
    result.set(ws,selected);
    lastAssigned=[...new Set(selected.map(e=>e.id))];
  }
  return result;
}
function getWeeklyPair(weekStart){return rotationScheduleThrough(weekStart).get(mondayOf(weekStart))||[];}
function makeDay(weekStart,dayOffset){
  const date=addDays(weekStart,dayOffset);
  if(isOfficeClosed(date))return {date,closed:true,closure:closureFor(date),A:null,B:null,notes:[]};
  const pair=getWeeklyPair(weekStart);
  if(!pair.length)return {date,closed:false,A:null,B:null,notes:["No available employees"]};
  function slot(employee){return employee?{employee,substitute:false,primary:employee,leave:isEmployeeOnLeave(employee,date)}:null;}
  return {date,closed:false,A:slot(pair[0]),B:slot(pair[1]),notes:[]};
}
function makeWeek(weekStart){
  const pair=getWeeklyPair(weekStart);
  return {weekStart,days:[0,1,2,3,4].map(i=>makeDay(weekStart,i)),pair,saved:false};
}
function currentWeek(){return selectedWeek||mondayOf(todayISO);}
function personName(person){return person?.name||"Unassigned";}
function pairNames(pair){const names=(pair||[]).filter(Boolean).map(e=>e.name);return names.length===2&&names[0]===names[1]?`${escapeHTML(names[0])} (both permits)`:names.map(escapeHTML).join(" & ")||"No available employees";}
function renderDay(day){
  if(day.closed)return `<div class="day"><div class="dayhead"><strong>${DAY_NAMES[parseDate(day.date).getDay()]} ${fmt(day.date)}</strong><span class="pill bad">Office closed</span></div><div class="slot sub">${escapeHTML(day.closure?.note||"Rotation paused")}</div></div>`;
  const slots=[day.A,day.B].filter(x=>x?.employee);
  const samePerson=slots.length===2&&slots[0].employee.id===slots[1].employee.id;
  function slot(x){const onLeave=!!x?.leave;return `<div class="slot ${onLeave?'leave-slot':''}"><strong>${escapeHTML(personName(x?.employee))}</strong>${onLeave?'<span class="pill leave-pill">Leave</span>':""}</div>`;}
  if(samePerson)return `<div class="day"><div class="dayhead"><strong>${DAY_NAMES[parseDate(day.date).getDay()]} ${fmt(day.date)}</strong></div><div class="permit-holder-list">${slot(slots[0])}<span class="pill">Using both permits</span></div></div>`;
  return `<div class="day"><div class="dayhead"><strong>${DAY_NAMES[parseDate(day.date).getDay()]} ${fmt(day.date)}</strong></div><div class="permit-holder-list">${slots.map(x=>slot(x)).join("")}</div></div>`;
}
function renderWeekView(){
  const currentStart=mondayOf(todayISO);
  const previousStart=addDays(currentStart,-7);
  const previous=makeWeek(previousStart);
  const previousNames=pairNames(previous.pair);
  let html=`<div class="schedule-intro"><div><span class="eyebrow">PARKING ALLOCATION</span><h2>Weekly Schedule</h2><p class="sub">Calculated from fixed rotation rules and annual leave · Current week highlighted · Three upcoming weeks</p></div><div class="schedule-key"><span><i class="dot permit-dot"></i>Parking permit</span></div></div>
  <div class="card previous-week"><div><span class="week-kicker">LAST WEEK · CALCULATED FROM ROTATION & LEAVE</span><h2>${escapeHTML(weekRange(previousStart))}</h2><div class="previous-rotation"><span class="rotation-label">Parking permit holders</span><strong>${previousNames}</strong></div></div></div>`;
  for(let i=0;i<4;i++){
    const ws=addDays(currentStart,i*7),w=makeWeek(ws);
    const isCurrent=i===0;
    const primaryNames=pairNames(w.pair);
    html+=`<div class="card week-card ${isCurrent?'current-week':''}"><div class="week-heading"><div><div class="week-kicker">${isCurrent?'CURRENT WEEK':`UPCOMING${w.saved?' · SAVED HISTORY':''}`}</div><h2>${escapeHTML(weekRange(ws))}</h2></div><div class="week-rotation"><span class="rotation-label">Parking permit holders</span><strong>${primaryNames}</strong></div></div><div class="daygrid">${w.days.map(renderDay).join("")}</div></div>`;
  }
  $("#view-week").innerHTML=html;
}
function renderEmployees(){
  const employees=[...data.employees].sort((a,b)=>(a.rotationOrder||999)-(b.rotationOrder||999));
  $("#view-employees").innerHTML=`<div class="section-intro"><span class="eyebrow">TEAM SETTINGS</span><h2>People & Annual Leave</h2><p class="sub">Manage the rotation order and annual leave in one place.</p></div><div class="card"><h2>Employee List</h2><p class="sub">New employees join the end of the rotation queue. Inactive employees remain in the data for record keeping.</p><form id="employeeForm"><div class="formgrid"><div><label>Employee name</label><input id="empName" required maxlength="80" placeholder="e.g. Alex"></div><div><label>Queue position</label><input value="Automatically added to the end" disabled></div></div><button class="primary" type="submit">Add employee</button></form></div><div class="card"><h2>Rotation Order</h2><div class="tablewrap"><table><thead><tr><th>Order</th><th>Name</th><th>Status</th><th>Actions</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${e.rotationOrder}</td><td>${escapeHTML(e.name)}</td><td>${e.active===false?'<span class="pill bad">Inactive</span>':'<span class="pill good">Active</span>'}</td><td><div class="actions"><button data-rename="${e.id}">Rename</button><button data-toggle="${e.id}">${e.active===false?"Reactivate":"Deactivate"}</button><button data-up="${e.id}" ${e.rotationOrder<=1?"disabled":""}>Move up</button><button data-down="${e.id}" ${e.rotationOrder>=employees.length?"disabled":""}>Move down</button></div></td></tr>`).join("")}</tbody></table></div></div><div id="leave-panel"></div>`;
  $("#employeeForm").onsubmit=e=>{e.preventDefault();const name=$("#empName").value.trim();if(!name)return;const max=Math.max(0,...data.employees.map(x=>Number(x.rotationOrder)||0));data.employees.push({id:uid("employee"),name,rotationOrder:max+1,active:true});markDirty("Added employee: "+name);renderAll();};
  $$("[data-rename]").forEach(b=>b.onclick=()=>{const e=data.employees.find(x=>x.id===b.dataset.rename);const n=prompt("Enter the employee name:",e.name);if(n&&n.trim()){const old=e.name;e.name=n.trim();markDirty(`Renamed employee: ${old} → ${e.name}`);renderAll();}});
  $$("[data-toggle]").forEach(b=>b.onclick=()=>{const e=data.employees.find(x=>x.id===b.dataset.toggle);e.active=e.active===false;markDirty(`${e.active?"Reactivated":"Deactivated"} employee: ${e.name}`);renderAll();});
  $$("[data-up],[data-down]").forEach(b=>b.onclick=()=>{const e=data.employees.find(x=>x.id===(b.dataset.up||b.dataset.down));const step=b.dataset.up?-1:1;const other=data.employees.find(x=>x.rotationOrder===e.rotationOrder+step);if(other){[e.rotationOrder,other.rotationOrder]=[other.rotationOrder,e.rotationOrder];markDirty("Changed rotation order");renderAll();}});
}
function renderLeave(){
  const opts=data.employees.map(e=>`<option value="${e.id}">${escapeHTML(e.name)}${e.active===false?"（Inactive）":""}</option>`).join("");
  $("#leave-panel").innerHTML=`<div class="section-intro availability-intro"><span class="eyebrow">CALENDAR EXCEPTIONS</span><h2>Annual Leave</h2><p class="sub">Record annual leave by date. The regular rotation order stays the same.</p></div><div class="card"><h2>Record Annual Leave</h2><p class="sub">Annual leave affects only the selected dates and does not change the rotation order. Please do not enter private reasons.</p><form id="leaveForm"><div class="field"><label>Employee</label><select id="leaveEmployee" required>${opts}</select></div><div class="formgrid"><div><label>Start date</label><input id="leaveStart" type="date" required></div><div><label>End date</label><input id="leaveEnd" type="date" required></div></div><div class="field"><label>Note (optional; avoid sensitive information)</label><input id="leaveNote" maxlength="120" placeholder="e.g. Annual leave"></div><button class="primary" type="submit">Add annual leave</button></form></div><div class="card"><h2>Annual Leave Records</h2>${data.leavePeriods.length?data.leavePeriods.map(p=>`<div class="listitem"><div class="between"><strong>${escapeHTML(data.employees.find(e=>e.id===p.employeeId)?.name||"Unknown employee")}</strong><button class="danger" data-delete-leave="${p.id}">Delete</button></div><div>${fmt(p.startDate,{day:"numeric",month:"short",year:"numeric"})} – ${fmt(p.endDate,{day:"numeric",month:"short",year:"numeric"})}</div>${p.note?`<div class="sub">${escapeHTML(p.note)}</div>`:""}</div>`).join(""):'<div class="empty">No annual leave recorded.</div>'}</div>`;
  $("#leaveForm").onsubmit=e=>{e.preventDefault();const start=$("#leaveStart").value,end=$("#leaveEnd").value;if(end<start){alert("The end date cannot be earlier than the start date.");return;}data.leavePeriods.push({id:uid("leave"),employeeId:$("#leaveEmployee").value,startDate:start,endDate:end,note:$("#leaveNote").value.trim()});markDirty("Added annual leave");renderAll();};
  $$("[data-delete-leave]").forEach(b=>b.onclick=()=>{if(confirm("Delete this annual leave record?")){data.leavePeriods=data.leavePeriods.filter(p=>p.id!==b.dataset.deleteLeave);markDirty("Deleted annual leave");renderAll();}});
}
function renderClosures(){
  $("#view-closure").innerHTML=`<div class="card"><h2>Office closed</h2><p class="sub">During a full office closure, rotation pauses and no parking permits are allocated. Rotation resumes when the office reopens. Start and end dates are inclusive.</p><form id="closureForm"><div class="formgrid"><div><label>Closure start date</label><input id="closureStart" type="date" required></div><div><label>Closure end date</label><input id="closureEnd" type="date" required></div></div><div class="field"><label>Note (optional)</label><input id="closureNote" maxlength="120" placeholder="e.g. Christmas office closure"></div><button class="primary" type="submit">Add closure period</button></form></div><div class="card"><h2>Scheduled closures</h2>${data.officeClosures.length?data.officeClosures.map(p=>`<div class="listitem"><div class="between"><strong>${p.startDate} – ${p.endDate}</strong><button class="danger" data-delete-closure="${p.id}">Delete</button></div>${p.note?`<div class="sub">${escapeHTML(p.note)}</div>`:""}</div>`).join(""):'<div class="empty">No office closures recorded.</div>'}</div>`;
  $("#closureForm").onsubmit=e=>{e.preventDefault();const start=$("#closureStart").value,end=$("#closureEnd").value;if(end<start){alert("The end date cannot be earlier than the start date.");return;}data.officeClosures.push({id:uid("closure"),startDate:start,endDate:end,note:$("#closureNote").value.trim()});markDirty("Added office closure");renderAll();};
  $$("[data-delete-closure]").forEach(b=>b.onclick=()=>{if(confirm("Delete this office closure period?")){data.officeClosures=data.officeClosures.filter(p=>p.id!==b.dataset.deleteClosure);markDirty("Deleted office closure");renderAll();}});
}
function markDirty(message){
  dirty=true;data.settings.lastUpdated=new Date().toISOString();
  data.changeLog.push({id:uid("change"),timestamp:new Date().toISOString(),description:message});
  $("#dataStatus").textContent="Unpublished changes";
}
function renderAdmin(){
  const json=JSON.stringify(data,null,2);
  $("#view-admin").innerHTML=`<div class="notice warn"><strong>Important: changes made on this static GitHub Pages site are not automatically saved back to the repository.</strong><br>After making changes here, download the updated data.json and upload it to GitHub, replacing the existing file. Other staff will then see the update. This project does not include login or password protection.</div><div class="card"><h2>Publish Data</h2><p class="sub">Past weeks are recalculated from the fixed rotation rules, annual leave and office closures currently in data.json. If employee order or leave records are edited later, calculated past schedules may change. Short leave (1–4 workdays) is shown as Leave without replacement; leave for 5 workdays in a roster week is skipped. The roster avoids assigning the same person in consecutive weeks when possible and always fills both permits if at least one employee is available. Download the JSON and replace data.json in your GitHub repository to publish updates.</p><div class="actions"><button class="primary" id="downloadJson">Download data.json</button><button id="copyJson">Copy JSON</button><button id="reloadJson">Reload published version</button></div><p id="adminMessage" class="sub"></p></div><div class="card"><h2>Import Data</h2><p class="sub">Choose a valid data.json file to load. Review the schedule, then download and publish it.</p><input id="importFile" type="file" accept=".json,application/json"><div class="actions" style="margin-top:10px"><button id="importJson" class="primary">Import selected JSON</button></div></div><div class="card"><h2>Data Validation</h2><div id="validation"></div></div><div class="card"><h2>Current Data Preview</h2><p class="sub">This is the data currently loaded in this browser, including unpublished changes.</p><textarea class="mono" rows="14" readonly id="jsonPreview"></textarea></div>`;
  $("#jsonPreview").value=json;
  $("#downloadJson").onclick=()=>{data.settings.lastUpdated=new Date().toISOString();$("#jsonPreview").value=JSON.stringify(data,null,2);const blob=new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click();URL.revokeObjectURL(a.href);$("#adminMessage").textContent=`data.json is ready. Upload this file to GitHub and replace the existing file.`;};
  $("#copyJson").onclick=async()=>{$("#jsonPreview").value=JSON.stringify(data,null,2);try{await navigator.clipboard.writeText(JSON.stringify(data,null,2));$("#adminMessage").textContent="JSON copied.";}catch(e){$("#jsonPreview").focus();$("#jsonPreview").select();$("#adminMessage").textContent="Please copy the contents of the text box manually.";}};
  $("#reloadJson").onclick=()=>{if(confirm("Reloading will discard changes that have not been downloaded. Continue?"))loadData();};
  $("#importJson").onclick=async()=>{const f=$("#importFile").files[0];if(!f){alert("Please select a JSON file first.");return;}try{const parsed=ensureShape(JSON.parse(await f.text()));if(!Array.isArray(parsed.employees))throw new Error("employees must be an array");if(!confirm("Importing will replace all data currently loaded in this page. Continue?"))return;data=parsed;markDirty("导入 JSON 数据");renderAll();alert("Import successful. Review the data, then download and publish it.");}catch(e){alert("Could not import JSON:"+e.message);}};
  const issues=[];
  if(activeEmployees().length<1)issues.push("No active employees are available. At least one active employee is needed to allocate both permits.");
  const ids=data.employees.map(e=>e.id);if(new Set(ids).size!==ids.length)issues.push("Duplicate employee IDs found.");
  for(const e of data.employees)if(!e.name||!Number.isFinite(Number(e.rotationOrder)))issues.push("An employee is missing a name or valid rotation order.");
  for(const p of [...data.leavePeriods,...data.availabilityPeriods,...data.officeClosures])if(p.startDate&&p.endDate&&p.endDate<p.startDate)issues.push("At least one record has an end date earlier than its start date.");
  $("#validation").innerHTML=issues.length?`<div class="notice warn">${issues.map(escapeHTML).join("<br>")}</div>`:'<div class="notice">Basic data checks passed. Review the eight-week schedule and date ranges before publishing.</div>';
}
function showTab(tab){
  $$("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  ["week","employees","closure","admin"].forEach(t=>$("#view-"+t).classList.toggle("hidden",t!==tab));
  if(tab==="week")renderWeekView();if(tab==="employees"){renderEmployees();renderLeave();}if(tab==="closure")renderClosures();if(tab==="admin")renderAdmin();
}
function renderAll(){
  if(!data)return;
  const active=activeEmployees();
  const notice=[];
  if(active.length<2)notice.push("At least two active employees are required to allocate both parking permits.");
  if(dirty)notice.push("You have unpublished changes. Open Data Management, download data.json and upload it to GitHub.");
  $("#globalNotice").innerHTML=notice.map(n=>`<div class="notice ${dirty?"warn":""}">${escapeHTML(n)}</div>`).join("");
  const tab=$(".tabs button.active")?.dataset.tab||"week";
  showTab(tab);
}
$$("[data-tab]").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
loadData();
</script>
</body>
</html>
